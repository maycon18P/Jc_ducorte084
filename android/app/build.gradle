}

android {
    namespace 'br.com.jcducorte084.app'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.jcducorte084.app'
        minSdk 24
        targetSdk 33
        versionCode 8
        versionName '8.0.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix ''
        }
    }
}


dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
